<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--CSS-->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/music.css">

    <!--HTMX-->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
        crossorigin="anonymous"></script>

    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <!--JS-->
    <script src="script.js"></script>

    <title>jen's music</title>
</head>

<body>

    <div class="grid-container">

        <!--Global Navigation & Hero Image-->

        <div hx-get="htmx-components/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

        <div class="hero-video">
            <video id="hero-video" autoplay muted loop playsinline>
                <source src="assets/WATCHME_asset.mp4" type="video/mp4">
            </video>
        </div>

        <!--Content of Page-->
        <div class="grid-item-new">
            <h1>newest music</h1>
            <div class="video-frame">
                <iframe src="https://www.youtube.com/embed/KiRFnZNfHRg"></iframe>
                <h1 id="watch-me">Watch me</h2>
                    <p>role: vocalist, producer &amp; video editor</p>
            </div>
        </div>

        <!--Global Footer-->
        <footer class="grid-footer">
            <nav hx-get="htmx-components/footer.html" hx-trigger="load" hx-swap="outerHTML"></nav>
        </footer>

        <div class="grid-arrow-back">
            <a href="persona.html">
                <img src="assets/arrowback-white.svg" alt="Arrow back" id="arrowback-white"></a>
        </div>

        <div class="grid-arrow-forward">
            <a href="videos.html">
                <img src="assets/arrowforward-white.svg" alt="Arrow forward" id="arrowforward-white"></a>
        </div>

    </div>

</body>

</html>
