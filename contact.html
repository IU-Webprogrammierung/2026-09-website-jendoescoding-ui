<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--CSS-->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/contact.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!--HTMX-->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
        crossorigin="anonymous"></script>

    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <!--JS-->
    <script src="script.js"></script>

    <title>jen's contact</title>
</head>

<body class="page-contact">

    <div class="grid-container">

        <!--Global Navigation & Hero Image-->

        <div hx-get="htmx-components/header.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <img src="assets/heroimagejen.jpg" alt="Jen sitting in grass" id="hero-main">


        <!--Content of Page-->

        <main class="grid-item-contact">

            <h1>Get in touch!</h1>
            <p>All fields are required.</p>

            <div class="form-field">
                <input type="text" id="yname" name="yname" placeholder="Your Name" required>
            </div>

            <div class="form-field">
                <input type="email" id="email" name="email" autocomplete="email" placeholder="Your E-Mail" required>
            </div>

            <div class="form-field">
                <textarea id="message" name="message" rows="6" placeholder="Your Message" required></textarea>
            </div>

            <div class="form-field form-check">
                <input type="checkbox" id="privacy-check" name="privacy-check" value="accepted" required>
                <label for="privacy">I’ve read the <a href="policy.html">privacy policy</a> and consent
                    to my data being shared in order to get in touch with jen.</label>
            </div>

            <a href="success.html" class="button-link">Submit</a>

        </main>

        <!--Global Footer-->

        <footer class="grid-footer">
            <nav hx-get="htmx-components/footer.html" hx-trigger="load" hx-swap="outerHTML"></nav>
        </footer>

        <div class="grid-arrow-back">
            <a href="equipment.html">
                <img src="assets/arrowback.svg" alt="Back to Equipment" id="arrowback"></a>
        </div>

        <div class="grid-arrow-forward">
            <a href="policy.html">
                <img src="assets/arrowforward.svg" alt="Continue to Privacy Policy" id="arrowforward"></a>
        </div>

    </div>

</body>

</html>
