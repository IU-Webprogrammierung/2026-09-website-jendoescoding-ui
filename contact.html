<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.svg">

    <!--CSS-->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/contact.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!--HTMX-->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
        crossorigin="anonymous"></script>

    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <!--JS-->
    <script src="script.js" defer></script>

    <title>jen's contact</title>
</head>

<body class="page-contact">

    <div class="grid-container">

        <!--Global Navigation & Hero Image-->

        <div hx-get="htmx-components/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

        <figure class="hero-frame-contact"><img src="assets/heroimagejen.jpg" alt="Cut Out of jen sitting in grass"
                id="hero-main">
        </figure>


        <!--Content of Page-->

        <main class="grid-item-contact">

            <header class="page-header">
                <h1>Get in touch!</h1>
            </header>

            <p>All fields are required.</p>

            <form class="contact-form" action="success.html">

                <label>
                    <input type="text" id="yname" name="yname" placeholder="Your Name" required>
                </label>

                <label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="Your E-Mail" required>
                </label>

                <label>
                    <textarea id="message" name="message" rows="6" placeholder="Your Message" required></textarea>
                </label>

                <button type="submit" class="button-link">Submit</button>
                <div class="form-field form-check">
                    <input type="checkbox" id="privacy-check" name="privacy-check" value="accepted" required>
                    <label for="privacy-check">I’ve read the <a href="policy.html">privacy policy</a> and consent
                        to my data being shared in order to get in touch with jen.</label>
                </div>

            </form>

        </main>

        <!--Global Footer-->

        <footer class="grid-footer">
            <nav hx-get="htmx-components/footer.html" hx-trigger="load" hx-swap="outerHTML"></nav>
        </footer>

        <nav class="grid-arrow-back">
            <a href="equipment.html">
                <img src="assets/icons/arrowback.svg" alt="Back to Equipment" id="arrowback"></a>
        </nav>

        <nav class="grid-arrow-forward">
            <a href="policy.html">
                <img src="assets/icons/arrowforward.svg" alt="Continue to Privacy Policy" id="arrowforward"></a>
        </nav>

    </div>

</body>

</html>
