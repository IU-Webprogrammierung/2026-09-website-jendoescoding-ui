<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--CSS-->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/videos.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!--HTMX-->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
        crossorigin="anonymous"></script>

    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <!--JS-->
    <script src="script.js"></script>

    <title>jen's videos</title>
</head>

<body>

    <div class="grid-container">

        <!--Global Navigation & Hero Image-->

        <div hx-get="htmx-components/header.html" hx-trigger="load" hx-swap="outerHTML"></div>
        <img src="assets/heroimagejen.jpg" alt="Jen sitting in grass" id="hero-main">

        <!--Content of Page-->

        <main class="videos-main">

            <div class="grid-item-video">
                <h1>videos</h1>
            </div>

            <div class="video-frame-1"><iframe width="420" height="315" src="https://www.youtube.com/embed/NBbfL5Ni-UI"
                    title="Video: Through The Darkness, a cover by jen"></iframe>
                <h2>Through the Darkness</h2>
                <p>role: vocalist, producer &amp; video editor</p>
            </div>

            <div class="video-frame-2"><iframe width="420" height="315" src="https://www.youtube.com/embed/zGUbGu3o45k"
                    title="Video: Square Up, a cover by jen"></iframe>
                <h2 id="square-up">Square Up</h2>
                <p>role: vocalist</p>
            </div>

            <div class="video-frame-3"><iframe width="420" height="315" src="https://www.youtube.com/embed/vOovxRfJs6M"
                    title="Video: Log Off, a cover by jen"></iframe>
                <h2 id="log-off">Log Off</h2>
                <p>role: vocalist</p>
            </div>

            <div class="video-frame-4"><iframe width="420" height="315" src="https://www.youtube.com/embed/usfW7LK3tsc"
                    title="Video: Show Me Your Revival, a cover by jen"></iframe>
                <h2 id="show-me-your-revival">Show Me Your Revival</h2>
                <p>role: vocalist &amp; video editor</p>
            </div>

        </main>


        <!--Global Footer-->

        <footer class="grid-footer">
            <nav hx-get="htmx-components/footer.html" hx-trigger="load" hx-swap="outerHTML"></nav>
        </footer>

        <div class="grid-arrow-back">
            <a href="music.html">
                <img src="assets/arrowback.svg" alt="Back to Music" id="arrowback"></a>
        </div>

        <div class="grid-arrow-forward">
            <a href="lyrics.html">
                <img src="assets/arrowforward.svg" alt="Continue to Lyrics" id="arrowforward"></a>
        </div>

    </div>

</body>

</html>
