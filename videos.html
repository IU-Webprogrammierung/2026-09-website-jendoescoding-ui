<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--CSS-->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/videos.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!--HTMX-->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
        crossorigin="anonymous"></script>

    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">

    <!--JS-->
    <script src="script.js" defer></script>

    <title>jen's videos</title>
</head>

<body class="page-videos">

    <div class="grid-container">

        <!--Global Navigation & Hero Image-->

        <div hx-get="htmx-components/header.html" hx-trigger="load" hx-swap="outerHTML"></div>

        <!--Content of Page-->

        <main class="videos-main">

            <header class="page-header">
                <h1>videos</h1>
            </header>

            <div class="video-layout">

                <div class="video-stage">
                    <iframe id="video-player" src="https://www.youtube.com/embed/NBbfL5Ni-UI"
                        allowfullscreen title="Video: Through The Darkness, a cover by jen"></iframe>
                </div>

                <div class="video-info" aria-live="polite">
                    <h2 id="video-title">Through the Darkness</h2>
                    <p id="video-role">role: vocalist, producer &amp; video editor</p>
                    <ul class="release-links" id="video-links" aria-label="Listen to this release"></ul>
                </div>

                <ul class="video-thumbs">
                    <li>
                        <button type="button" class="video-thumb" aria-current="true"
                            data-id="NBbfL5Ni-UI" data-title="Through the Darkness"
                            data-role="role: vocalist, producer &amp; video editor"
                            data-spotify="https://open.spotify.com/intl-de/album/0hjlnPMMNkYDcwQ0YnIpsB"
                            data-apple="https://music.apple.com/de/album/through-the-darkness-from-resident-evil-requiem-single/6767786313"
                            data-soundcloud="https://soundcloud.com/xunreachablee/through-the-darkness-city-pop-ver-jen">
                            <img src="assets/thumbs/through-the-darkness.jpg" alt="" width="320" height="180">
                            <span>Through the Darkness</span>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="video-thumb"
                            data-id="zGUbGu3o45k" data-title="Square Up" id="square-up" data-role="role: vocalist">
                            <img src="assets/thumbs/square-up.jpg" alt="" width="320" height="180">
                            <span>Square Up</span>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="video-thumb"
                            data-id="vOovxRfJs6M" data-title="Log Off" id="log-off" data-role="role: vocalist">
                            <img src="assets/thumbs/log-off.jpg" alt="" width="320" height="180">
                            <span>Log Off</span>
                        </button>
                    </li>
                    <li>
                        <button type="button" class="video-thumb"
                            data-id="usfW7LK3tsc" data-title="Show Me Your Revival"
                            data-role="role: vocalist &amp; video editor"
                            data-spotify="https://open.spotify.com/intl-de/album/42ulzgyPbhvIfj2ugpDTHg"
                            data-apple="https://music.apple.com/us/album/show-me-your-revival-feat-jen-revival-remix-single/6785678553">
                            <img src="assets/thumbs/show-me-your-revival.jpg" alt="" width="320" height="180">
                            <span>Show Me Your Revival</span>
                        </button>
                    </li>
                </ul>

            </div>
        </main>

        <!--Global Footer-->

        <footer class="grid-footer">
            <nav hx-get="htmx-components/footer.html" hx-trigger="load" hx-swap="outerHTML"></nav>
        </footer>

        <nav class="grid-arrow-back">
            <a href="music.html">
                <img src="assets/arrowback.svg" alt="Back to Music" id="arrowback"></a>
        </nav>

        <nav class="grid-arrow-forward">
            <a href="lyrics.html">
                <img src="assets/arrowforward.svg" alt="Continue to Lyrics" id="arrowforward"></a>
        </nav>

    </div>

</body>

</html>
